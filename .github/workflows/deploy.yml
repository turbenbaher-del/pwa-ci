name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build
      env:
        # Адрес прокси и токен доступа к нему подставляются из секретов репозитория,
        # чтобы не держать их в коде. Задать: Settings → Secrets and variables → Actions.
        VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
        VITE_PROXY_TOKEN: ${{ secrets.VITE_PROXY_TOKEN }}

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        force_orphan: true
